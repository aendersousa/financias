name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync web assets into the iOS project
        run: npx cap sync ios

      - name: Build unsigned .app
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        working-directory: ios/App
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/App.app" Payload/
          rm -rf Payload/App.app/Frameworks/*.framework/*.framework 2>/dev/null || true
          zip -r -X -q ../../Financias-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Financias-unsigned-ipa
          path: Financias-unsigned.ipa
          retention-days: 30
